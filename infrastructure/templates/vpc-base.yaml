AWSTemplateFormatVersion: '2010-09-09'
Description: 'VPC base con subredes para Dev, Prod y Admin - Configurable por parámetros'

Parameters:
  EnvironmentName:
    Type: String
    Description: 'Nombre del entorno (dev, staging, prod)'
    AllowedValues:
      - dev
      - staging
      - prod
    ConstraintDescription: 'Debe ser dev, staging o prod'
  
  VpcCidr:
    Type: String
    Default: '10.0.0.0/16'
    Description: 'CIDR block para la VPC principal'
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$'
    ConstraintDescription: 'Debe ser un CIDR block válido (ej: 10.0.0.0/16)'
  
  SubnetDevCidr:
    Type: String
    Default: '10.0.10.0/24'
    Description: 'CIDR para subnet de Desarrollo'
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(2[4-9]|3[0-2]))$'
    ConstraintDescription: 'Debe ser un CIDR /24 a /32 válido'
  
  SubnetProdCidr:
    Type: String
    Default: '10.0.20.0/24'
    Description: 'CIDR para subnet de Producción'
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(2[4-9]|3[0-2]))$'
    ConstraintDescription: 'Debe ser un CIDR /24 a /32 válido'
  
  SubnetAdminCidr:
    Type: String
    Default: '10.0.30.0/24'
    Description: 'CIDR para subnet de Admin-Normas'
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(2[4-9]|3[0-2]))$'
    ConstraintDescription: 'Debe ser un CIDR /24 a /32 válido'
  
  EnableDnsHostnames:
    Type: String
    Default: 'true'
    Description: 'Habilitar DNS hostnames en la VPC'
    AllowedValues:
      - 'true'
      - 'false'
    ConstraintDescription: 'Debe ser true o false'
  
  EnableDnsSupport:
    Type: String
    Default: 'true'
    Description: 'Habilitar soporte DNS en la VPC'
    AllowedValues:
      - 'true'
      - 'false'
    ConstraintDescription: 'Debe ser true o false'

Mappings:
  EnvironmentTags:
    dev:
      Color: "Green"
      Priority: "Low"
    staging:
      Color: "Yellow"
      Priority: "Medium"
    prod:
      Color: "Red"
      Priority: "High"

Resources:
  # VPC PRINCIPAL
  VPC:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: !Ref EnableDnsHostnames
      EnableDnsSupport: !Ref EnableDnsSupport
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-VPC'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: 'CloudFormation'
        - Key: Project
          Value: 'LegalPlatform'
        - Key: EnvironmentColor
          Value: !FindInMap [EnvironmentTags, !Ref EnvironmentName, Color]

  # INTERNET GATEWAY
  InternetGateway:
    Type: 'AWS::EC2::InternetGateway'
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-IGW'
        - Key: Environment
          Value: !Ref EnvironmentName

  # ATTACH IGW TO VPC
  VPCGatewayAttachment:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # SUBNET 1 - DESARROLLO
  SubnetDev:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref SubnetDevCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Subnet-Dev'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Tier
          Value: 'Development'
        - Key: AZ
          Value: !Select [0, !GetAZs '']

  # SUBNET 2 - PRODUCCIÓN
  SubnetProd:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref SubnetProdCidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Subnet-Prod'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Tier
          Value: 'Production'
        - Key: AZ
          Value: !Select [1, !GetAZs '']

  # SUBNET 3 - ADMIN-NORMAS
  SubnetAdmin:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref SubnetAdminCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Subnet-Admin'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Tier
          Value: 'Admin-Rules'
        - Key: AZ
          Value: !Select [0, !GetAZs '']

  # ROUTE TABLE PARA SUBNETS PRIVADAS
  PrivateRouteTable:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Private-RT'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Type
          Value: 'Private'

  # ASOCIAR SUBNETS CON ROUTE TABLE
  SubnetDevRouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref SubnetDev
      RouteTableId: !Ref PrivateRouteTable

  SubnetProdRouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref SubnetProd
      RouteTableId: !Ref PrivateRouteTable

  SubnetAdminRouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref SubnetAdmin
      RouteTableId: !Ref PrivateRouteTable

Outputs:
  VPCId:
    Description: 'ID de la VPC creada'
    Value: !Ref VPC
    Export:
      Name: !Sub '${AWS::StackName}-VPCId'

  VPCCidr:
    Description: 'CIDR block de la VPC'
    Value: !Ref VpcCidr
    Export:
      Name: !Sub '${AWS::StackName}-VPCCidr'

  SubnetDevId:
    Description: 'ID de la subnet de Desarrollo'
    Value: !Ref SubnetDev
    Export:
      Name: !Sub '${AWS::StackName}-SubnetDevId'

  SubnetProdId:
    Description: 'ID de la subnet de Producción'
    Value: !Ref SubnetProd
    Export:
      Name: !Sub '${AWS::StackName}-SubnetProdId'

  SubnetAdminId:
    Description: 'ID de la subnet de Admin-Normas'
    Value: !Ref SubnetAdmin
    Export:
      Name: !Sub '${AWS::StackName}-SubnetAdminId'

  InternetGatewayId:
    Description: 'ID del Internet Gateway'
    Value: !Ref InternetGateway
    Export:
      Name: !Sub '${AWS::StackName}-InternetGatewayId'

  PrivateRouteTableId:
    Description: 'ID de la tabla de rutas privada'
    Value: !Ref PrivateRouteTable
    Export:
      Name: !Sub '${AWS::StackName}-PrivateRouteTableId'

  Environment:
    Description: 'Nombre del entorno desplegado'
    Value: !Ref EnvironmentName
    Export:
      Name: !Sub '${AWS::StackName}-Environment'
